name: Publish VS Code Extension (platform-specific)

# ALTERNATIVE to publish-vscode-extension.yml (the universal, pure-JS build). This one bundles
# @ironbee-ai/devtools + its NATIVE deps (sharp / node-pty / frida) built on a real runner of
# each target OS/arch, and publishes one VSIX per platform with `--target`. The extension then
# runs the bundled devtools directly (no npx), so no node/npx is needed on the user machine.
#
# CAVEAT: this only helps if the registry + client serve the platform-appropriate VSIX. VS Code
# Marketplace does; open-vsx.org / Cursor support is not confirmed — verify empirically before
# relying on this. When unsure, prefer the universal build.

on:
  workflow_dispatch:
    inputs:
      version_scale:
        type: choice
        description: 'Version scale'
        required: true
        default: 'patch'
        options: [patch, minor, major]

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # browsers are installed at runtime by playwright-core

jobs:
  # 1) Bump version + tag once, so every platform build publishes the same version.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
      - run: npm ci --omit=optional
      - name: Release (bump + tag + GitHub release, no publish)
        run: npm run release:${{ github.event.inputs.version_scale }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      - id: bump
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # 2) Build + publish one VSIX per target, each with the platform-native devtools bundled.
  publish:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: win32-x64
            os: windows-latest
          # win32-arm64 needs an arm64 Windows runner (limited availability) — enable when ready:
          # - target: win32-arm64
          #   os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Base deps from the committed lockfile (cli + playwright-core). Plain `npm ci` installs
      # optional deps by default, so the platform-native optional deps (e.g. sharp's
      # @img/sharp-<platform>) are fetched for THIS runner's OS/arch.
      - run: npm ci
      # Bundle @ironbee-ai/devtools at the version the bundled CLI pins — installed on THIS runner so
      # npm fetches the correct native (sharp/node-pty/frida) for this OS/arch. It MUST be a real
      # dependency (not --no-save): `vsce package` runs `npm ls` to decide what to bundle and fails on
      # extraneous packages. This runs in the ephemeral CI checkout, so mutating package.json here does
      # NOT affect the committed lockfile (which stays devtools-free — the universal build must not
      # bundle it). --include=optional makes the platform natives explicit.
      - name: Bundle platform-native devtools
        shell: bash
        run: |
          V=$(node node_modules/@ironbee-ai/cli/dist/index.js devtools version)
          echo "Bundling @ironbee-ai/devtools@$V for ${{ matrix.target }}"
          npm pkg set "dependencies.@ironbee-ai/devtools=$V"
          # devtools pulls playwright, which pins fsevents 2.3.2 while the dev tree dedupes 2.3.3.
          # On macOS runners (fsevents is macOS-only) that mismatch makes `vsce package`'s internal
          # `npm ls` fail (ELSPROBLEMS); pin one version so the tree is clean. Inert on Linux/Windows.
          npm pkg set "overrides.fsevents=2.3.3"
          npm install --include=optional
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - name: Package (platform-specific)
        run: npx vsce package --target ${{ matrix.target }} -o "ironbee-vscode-${{ matrix.target }}.vsix"
      - name: Publish to Open VSX (platform-specific)
        run: npx ovsx publish "ironbee-vscode-${{ matrix.target }}.vsix" --target ${{ matrix.target }} --pat "$OPEN_VSX_TOKEN"
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: ironbee-vscode-${{ matrix.target }}.vsix
          retention-days: 30
